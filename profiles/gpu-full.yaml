# VisionOCR Pro — GPU 全功能部署 (RTX 4070 Ti 12GB 开发机/产线工控机)
# 启动: python app.py --profile gpu-full

device: "auto"

vram:
  max_budget_gb: 12
  idle_unload_sec: 1800      # v1.3.0: 后台空闲卸载生效, 常驻引擎豁免
  quantization: "q4"

ocr:
  default_engine: "rapidocr" # v1.3.0: 默认本地快速引擎 (PP-OCRv6 为高精度插件)
  fallback_engine: "rapidocr"
  ppocrv6:
    gpu: true
    timeout: 120

qc:
  patchcore:
    input_size: 512
    conservative_mode: true
  union:
    enable_patchcore: true
    enable_dino: true

model_source: "huggingface"
hf_mirror: "https://hf-mirror.com"

name: Release Gate

on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install system deps (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libzbar0

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements-test.txt --quiet

      - name: Syntax check (all modules)
        run: python -m py_compile app.py && python scripts/check_syntax.py

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

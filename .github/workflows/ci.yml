name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install system deps (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libzbar0

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements-test.txt --quiet

      - name: Syntax check (all modules)
        run: python -m py_compile app.py && python scripts/check_syntax.py

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  lint:
    name: Encoding & structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for non-UTF8 files
        run: |
          find . -name "*.py" -not -path "./.venv/*" | while read f; do
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "NON-UTF8: $f"
              exit 1
            fi
          done
          echo "All .py files are valid UTF-8"

      - name: Check no secrets in config
        run: |
          if grep -rn "api_key.*=.*['\"][a-zA-Z0-9]" config.yaml .env.example 2>/dev/null | grep -v ':-'; then
            echo "WARNING: Possible hardcoded secret found"
            exit 1
          fi
          echo "No hardcoded secrets detected"

      - name: Check no hardcoded local data paths
        run: |
          # Block user-specific drive paths (E:\, D:\rxs, D:\00_, etc.)
          # Allow: C:\Program Files (standard SDK), D:\images (generic Docker example)
          VIOLATIONS=$(grep -rn --include="*.py" -E '[A-Z]:\\\\' . \
            | grep -v '.venv/' \
            | grep -v 'C:\\\\Program Files' \
            | grep -v 'local_data_paths' \
            | grep -v '#' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Hardcoded local paths found in .py files:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No hardcoded local data paths in Python files"

      - name: Check personal identifiers in code
        run: |
          # 个人邮箱不得出现在产品代码 (测试夹具除外)
          EMAILS=$(grep -rn --include="*.py" -E '@(gmail|qq|163|126|outlook|hotmail|foxmail)\.com' . \
            | grep -v '.venv/' | grep -v '/tests/' || true)
          if [ -n "$EMAILS" ]; then
            echo "ERROR: Personal email addresses found:"
            echo "$EMAILS"
            exit 1
          fi
          # 公司/客户名不得硬编码进 .py (配置唯一来源是 config.yaml 的 company 段)
          CLIENTS=$(grep -rn --include="*.py" -E '有限公司|股份有限公司|集团' . \
            | grep -v '.venv/' | grep -v '/tests/' || true)
          if [ -n "$CLIENTS" ]; then
            echo "ERROR: Hardcoded company/client names in .py:"
            echo "$CLIENTS"
            exit 1
          fi
          echo "No personal identifiers in product code"

# VisionOCR Pro 配置文件
# 修改后重启生效

server_name: "127.0.0.1"
server_port: 7860

# 模型权重目录 (相对项目根或绝对路径)
models_dir: "models"
data_dir: "data"

# 我方主体 (回款管理基础): 用于判断合同款项方向
# 合同里出现该主体名称作为收款方时, 对应款项记为"应收/回款"; 反之记为"应付"
company:
  name: "苏州锐新视科技有限公司"
  aliases: ["锐新视", "RXS", "锐新视科技"]

# 合同汇总导出 (插件化: excel/csv/yonyou/kingdee, 按需启用)
export:
  dir: "exports"              # 导出文件落盘目录 (相对项目根或绝对路径)
  enabled:                    # 启用的导出器列表
    - "excel"                 # 双 Sheet Excel (合同总览 + 应收明细)
    - "csv"                   # 通用 CSV (utf-8-sig, 适配无API系统导入)
    # - "yonyou"              # 用友 U8/T+/YonSuite (需配置下方凭据)
    # - "kingdee"             # 金蝶 K3/云星空 (需配置下方凭据)
  # 用友 ERP 对接 (试点工厂填入实际地址和凭据后取消注释 enabled)
  yonyou:
    base_url: "${YONYOU_BASE_URL:-}"
    app_key: "${YONYOU_APP_KEY:-}"
    app_secret: "${YONYOU_APP_SECRET:-}"
  # 金蝶 ERP 对接
  kingdee:
    base_url: "${KINGDEE_BASE_URL:-}"
    acct_id: "${KINGDEE_ACCT_ID:-}"
    username: "${KINGDEE_USERNAME:-}"
    password: "${KINGDEE_PASSWORD:-}"
    lcid: 2052                # 语言 (2052=中文)

# IM 通知 (回款提醒推送给签单人)
# 使用群机器人 Webhook, 无需 OAuth 审批; 配合 signer_map 表 @mention 对应签单人
notify:
  feishu_webhook: "${FEISHU_WEBHOOK:-}"
  wecom_webhook: "${WECOM_WEBHOOK:-}"
  desktop_fallback: true      # IM 未配置/失败时回退桌面通知
  # 默认联系人: 签单人缺失或映射表查不到时, 提醒发给此人 (老板指定)
  default_contact:
    name: ""                  # 如 "王总"
    feishu_id: ""
    wecom_id: ""

# 定时调度器 (回款提醒自动化)
# 双保险: 应用内 APScheduler + Windows 计划任务 (应用关闭后兜底)
scheduler:
  enabled: true
  reminder_time: "09:00"     # 每日提醒扫描时间 (HH:MM, 24小时制)
  catch_up: true             # 启动时补跑: 若上次运行距今 >24h, 立即执行一次
  status_file: "data/scheduler_state.json"

# 模型下载源: huggingface | modelscope | local
model_source: "huggingface"
# HuggingFace 镜像 (国内网络不稳定时启用, 自动设置 HF_ENDPOINT)
# 可选: "" (直连) | "https://hf-mirror.com" (国内镜像)
hf_mirror: "https://hf-mirror.com"

# 设备: cuda | cpu | auto
device: "auto"

# 显存管理
vram:
  max_budget_gb: 12          # RTX 4070 Ti
  idle_unload_sec: 1800      # 空闲 30min 自动卸载 (v1.3.0 起由后台线程执行; 常驻引擎豁免)
  quantization: "q4"         # VLM 量化: q4 | q5 | q8 | fp16

# OCR 引擎配置
# v1.3.0: 默认引擎降级为 RapidOCR (纯本地, 无 Docker 依赖, 消除 5-13s 容器开销);
# PP-OCRv6 作为高精度插件 (93.3% 精确匹配), 在 UI 引擎选择中显式使用。
ocr:
  default_engine: "rapidocr" # ppocrv6 | ovisocr2 | paddleocr_vl | rapidocr
  fallback_engine: "rapidocr" # 主引擎不可用时降级 (与默认相同=无二次降级)
  confidence_threshold: 0.75 # 置信度 < 此值 → "待人工复核" (NG 拦截)
  # PP-OCRv6 高精度插件 (Docker 隔离, 93.3% 精确匹配, 按需显式调用)
  ppocrv6:
    gpu: true                  # Docker 容器内使用 GPU
    timeout: 120               # 单次推理超时 (秒)
    docker_image: "visionocr-paddleocr"
  scene_classifier:
    enabled: true
    confidence_threshold: 0.7
    fallback_engine: "rapidocr"
  # 图像预处理 (提升工业标记/小字符/低对比度场景精度)
  preprocess:
    enabled: true
    clahe: true              # CLAHE 对比度增强
    clahe_clip: 2.0
    sharpen: true            # USM 锐化
    upscale: true            # 小图放大 (高度 < 800px 时 2x)
    upscale_factor: 2.0
    denoise: true            # 去噪
    binarize: false          # 自适应二值化 (仅纯黑白刻字场景开启)

# LLM 配置 (分级路由: 本地优先, 云端兜底)
llm:
  # 路由策略:
  #   local_only                 - 仅本地, 失败则降级规则抽取
  #   local_first_cloud_fallback - 本地优先, 能力不足时升级云端 (默认, 推荐)
  #   cloud_first                - 云端优先 (本地仅兜底)
  routing:
    policy: "local_first_cloud_fallback"
    confidence_threshold: 0.6      # 本地抽取置信度低于此值 → 升级云端
    escalate_on_validation_fail: true  # 金额勾稽/JSON校验失败 → 升级云端

  # 本地 Ollama (优先)
  # 显存充足的机器: qwen3-vl:8b; 显存小的工厂电脑: 可换小文本模型, 如 qwen2.5:3b / qwen3:1.7b
  # 注: 合同抽取走 OCR→文本→LLM, 纯文本模型即可胜任, 不必勉强跑视觉模型
  ollama:
    model: "qwen3-vl:8b"
    host: "http://localhost:11434"
    timeout: 600

  # 云端 API 兜底 (OpenAI 兼容协议, 默认 DeepSeek)
  # 因为输入是 OCR 后的文本, 云端用纯文本大模型即可 (便宜且结构化抽取能力强)
  api:
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"          # deepseek-chat (V4 flash) / deepseek-reasoner (V4 pro)
    api_key: ""                     # 填入 API Key 或设置环境变量 VISIONOCR_API_KEY
    timeout: 120

# 相机配置 (默认海康)
camera:
  type: "hikvision"          # opencv | gigevision | hikvision
  index: 0
  gigE_ip: "192.168.1.100"
  trigger: "software"        # software | hardware
  exposure_us: 5000
  hik_sdk_path: "${HIK_SDK_PATH:-C:\\Program Files (x86)\\MVS\\Development\\Bin\\Win64_x64}"

# Sizector 3D 结构光深度相机 (Phase 4C: 深度融合缺陷检测)
# 通过 .NET wrapper (MPSizectorS_DotNet.dll) + pythonnet 调用, 输出深度图(mm)+RGB
sizector:
  enabled: true
  # .NET wrapper 目录 (含 MPSizectorS_DotNet.dll), 按实际 SDK 安装路径修改
  dll_dir: "${SIZECTOR_SDK_DIR:-}"
  index: 0                   # 多相机时按枚举顺序选择
  serial: ""                 # 可选: 按序列号精确匹配目标相机 (优先于 index)
  working_mode: "precise"    # fastest | fast | standard | precise | super_precise | dynamic
  use_rgb: true              # 采集辅助 RGB (否则仅灰度)
  timeout_ms: 5000
  mock: false                # true 时不连硬件, 输出合成深度帧 (开发/演示/CI)
  mock_width: 640
  mock_height: 480

# 默认激活场景 (UI 启动时优先展示)
default_scenes:
  - "contract"               # 合同自动化 (P0)
  - "qc"                    # 工业质检 (P0)

# 条码识别
barcode:
  engine: "zbar"             # dynamsoft | zbar
  dynamsoft_license: ""

# 质检
qc:
  anomaly_algorithm: "patchcore"   # patchcore (推荐) | dinomaly | visualad
  grounding_dino_model: "tiny"    # tiny (快, 1.2GB) | base (精, 2.5GB)
  confidence_threshold: 0.5
  auto_ng_alert: true
  # PatchCore 生产级配置 (质量/鲁棒性优先, 零漏检)
  patchcore:
    input_size: 512               # 输入分辨率 (512保微小缺陷, 256省显存)
    coreset_ratio: 0.1            # 记忆库压缩比 (0.1=10%, 越小越快精度略降)
    conservative_mode: true       # 保守阈值: 阈值×0.5, 最大化召回 (宁可误报不漏检)
    np_epsilon: 0.10              # NP校准目标误报率: 零漏检取向(Recall优先, 误报人工复核兜底)
                                  # 实测(KolektorSDD holdout): 0.02→Recall38.5%/FPR4.3% | 0.10→Recall76.9%/FPR11.4%
  # DINOv2 异常检测 (Union 第4源: 与 PatchCore 特征互补, 降低漏检)
  dinov2:
    model_id: "facebook/dinov2-small"  # Apache-2.0, HF缓存离线可用
    input_size: 518               # 输入分辨率 (14的倍数, 518=DINOv2标准)
    pca_dim: 64                   # PCA白化降维维度 (GMM稳定性)
    n_etalons: 8                  # GMM分量数 (正常模式原型数)
    np_epsilon: 0.10              # NP校准目标误报率 (与patchcore一致): 0.02→Recall5.8%/FPR0% | 0.10→Recall67.3%/FPR2.9%
  # 双模型 Union OR (零漏检架构: 任一NG→最终NG, 误报人工复核兜底)
  union:
    enable_patchcore: true        # 表面异常: 划痕/凹陷/色差 (需OK样本建库)
    enable_dino: true             # 结构缺陷: 缺件/错位/标签歪 (需提示词)
    enable_yolo: true             # 结构缺陷: 缺孔/短路/毛刺 (少样本微调, 需训练权重)
    enable_dinov2: true           # 表面异常: DINOv2特征+GMM分布建模 (与PatchCore互补, 需OK样本建库)
  # 瑕疵尺寸过滤 (产线刚需: 过滤灰尘噪点 + 排除背景误检)
  defect_size:
    enabled: true
    min_area_px: 100            # 最小面积 (像素²), 小于此视为噪点忽略
    max_area_px: 500000         # 最大面积 (像素²), 大于此可能是背景/误检
    min_area_mm2: 0.0           # 最小面积 (毫米²), 0=不启用物理单位过滤
    max_area_mm2: 0.0           # 最大面积 (毫米²), 0=不启用
    pixels_per_mm: 0.0          # 相机标定系数 (像素/毫米), 0=未标定仅用像素
    mode: "bbox"                # bbox (检测框面积) | contour (精确轮廓面积)
  # VLM 缺陷解释 (Phase 3: 智能 ROI 裁切 → 本地 VLM 局部识读)
  # Union NG 后由 UI "AI 解释" 按钮触发; 整图解释慢且失焦, 裁切候选区
  # 后 token 消耗与延迟显著下降, 描述更聚焦。
  vlm_explain:
    enabled: true
    max_rois: 3                 # 最多解释的候选区域数
    min_area_frac: 0.0005       # 连通域最小面积占全图比例 (滤噪点)
    pad_frac: 0.25              # ROI 外扩比例 (给 VLM 留上下文)
    rel_thresh: 0.45            # 热力图相对阈值 (相对自身峰值)
    max_tokens: 512             # 每区域回答 token 上限 (短答约束)
    no_think: true              # qwen3-vl 跳过思考链 (省时延省token)
    prompt: ""                  # 自定义提示词 (空=内置工业质检提示词)

# YOLO 结构缺陷检测引擎 (少样本微调)
yolo_defect:
  weights: ""                     # 权重路径, 空=自动发现 finetune/output_yolo/pcb_defect/weights/best.pt
  confidence_threshold: 0.25      # 检出置信度阈值 (低→高召回, 零漏检优先)
  imgsz: 1280                     # 推理分辨率 (1280 保微缺陷, 640 省显存/提速)

# 行为分析 (P2 可选)
behavior:
  enabled: false
  pose_model: "rtmpose-m"
  fatigue_threshold: 0.7
  sop_sequence: []

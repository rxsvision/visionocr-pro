# VisionOCR Pro 配置文件
# 修改后重启生效

server_name: "127.0.0.1"
server_port: 7860

# 模型权重目录 (相对项目根或绝对路径)
models_dir: "models"
data_dir: "data"

# 我方主体 (回款管理基础): 用于判断合同款项方向
# 合同里出现该主体名称作为收款方时, 对应款项记为"应收/回款"; 反之记为"应付"
company:
  name: "苏州锐新视科技有限公司"
  aliases: ["锐新视", "RXS", "锐新视科技"]

# 合同汇总导出 (插件化: excel/csv/yonyou/kingdee, 按需启用)
export:
  dir: "exports"              # 导出文件落盘目录 (相对项目根或绝对路径)
  enabled:                    # 启用的导出器列表
    - "excel"                 # 双 Sheet Excel (合同总览 + 应收明细)
    - "csv"                   # 通用 CSV (utf-8-sig, 适配无API系统导入)
    # - "yonyou"              # 用友 U8/T+/YonSuite (需配置下方凭据)
    # - "kingdee"             # 金蝶 K3/云星空 (需配置下方凭据)
  # 用友 ERP 对接 (试点工厂填入实际地址和凭据后取消注释 enabled)
  yonyou:
    base_url: ""              # 如 http://192.168.1.100:8080
    app_key: ""
    app_secret: ""
  # 金蝶 ERP 对接
  kingdee:
    base_url: ""              # 如 http://192.168.1.200/k3cloud
    acct_id: ""               # 账套ID
    username: ""
    password: ""
    lcid: 2052                # 语言 (2052=中文)

# IM 通知 (回款提醒推送给签单人)
# 使用群机器人 Webhook, 无需 OAuth 审批; 配合 signer_map 表 @mention 对应签单人
notify:
  feishu_webhook: ""          # 飞书群机器人: https://open.feishu.cn/open-apis/bot/v2/hook/{token}
  wecom_webhook: ""           # 企微群机器人: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key={key}
  desktop_fallback: true      # IM 未配置/失败时回退桌面通知
  # 默认联系人: 签单人缺失或映射表查不到时, 提醒发给此人 (老板指定)
  default_contact:
    name: ""                  # 如 "王总"
    feishu_id: ""
    wecom_id: ""

# 定时调度器 (回款提醒自动化)
# 双保险: 应用内 APScheduler + Windows 计划任务 (应用关闭后兜底)
scheduler:
  enabled: true
  reminder_time: "09:00"     # 每日提醒扫描时间 (HH:MM, 24小时制)
  catch_up: true             # 启动时补跑: 若上次运行距今 >24h, 立即执行一次
  status_file: "data/scheduler_state.json"

# 模型下载源: huggingface | modelscope | local
model_source: "huggingface"
# HuggingFace 镜像 (国内网络不稳定时启用, 自动设置 HF_ENDPOINT)
# 可选: "" (直连) | "https://hf-mirror.com" (国内镜像)
hf_mirror: "https://hf-mirror.com"

# 设备: cuda | cpu | auto
device: "auto"

# 显存管理
vram:
  max_budget_gb: 12          # RTX 4070 Ti
  idle_unload_sec: 300       # 空闲 5min 自动卸载
  quantization: "q4"         # VLM 量化: q4 | q5 | q8 | fp16

# OCR 引擎配置
ocr:
  default_engine: "auto"     # auto | ovisocr2 | paddleocr_vl | hunyuan | rapidocr
  confidence_threshold: 0.75 # 置信度 < 此值 → "待人工复核" (NG 拦截)
  scene_classifier:
    enabled: true
    confidence_threshold: 0.7
    fallback_engine: "paddleocr_vl"
  # 图像预处理 (提升工业标记/小字符/低对比度场景精度)
  preprocess:
    enabled: true
    clahe: true              # CLAHE 对比度增强
    clahe_clip: 2.0
    sharpen: true            # USM 锐化
    upscale: true            # 小图放大 (高度 < 800px 时 2x)
    upscale_factor: 2.0
    denoise: true            # 去噪
    binarize: false          # 自适应二值化 (仅纯黑白刻字场景开启)

# LLM 配置 (分级路由: 本地优先, 云端兜底)
llm:
  # 路由策略:
  #   local_only                 - 仅本地, 失败则降级规则抽取
  #   local_first_cloud_fallback - 本地优先, 能力不足时升级云端 (默认, 推荐)
  #   cloud_first                - 云端优先 (本地仅兜底)
  routing:
    policy: "local_first_cloud_fallback"
    confidence_threshold: 0.6      # 本地抽取置信度低于此值 → 升级云端
    escalate_on_validation_fail: true  # 金额勾稽/JSON校验失败 → 升级云端

  # 本地 Ollama (优先)
  # 显存充足的机器: qwen3-vl:8b; 显存小的工厂电脑: 可换小文本模型, 如 qwen2.5:3b / qwen3:1.7b
  # 注: 合同抽取走 OCR→文本→LLM, 纯文本模型即可胜任, 不必勉强跑视觉模型
  ollama:
    model: "qwen3-vl:8b"
    host: "http://localhost:11434"
    timeout: 600

  # 云端 API 兜底 (OpenAI 兼容协议, 默认 DeepSeek)
  # 因为输入是 OCR 后的文本, 云端用纯文本大模型即可 (便宜且结构化抽取能力强)
  api:
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"          # deepseek-chat (V4 flash) / deepseek-reasoner (V4 pro)
    api_key: ""                     # 填入 API Key 或设置环境变量 VISIONOCR_API_KEY
    timeout: 120

# 相机配置 (默认海康)
camera:
  type: "hikvision"          # opencv | gigevision | hikvision
  index: 0
  gigE_ip: "192.168.1.100"
  trigger: "software"        # software | hardware
  exposure_us: 5000
  hik_sdk_path: "C:\\Program Files (x86)\\MVS\\Development\\Bin\\Win64_x64"

# Sizector 3D 结构光深度相机 (Phase 4C: 深度融合缺陷检测)
# 通过 .NET wrapper (MPSizectorS_DotNet.dll) + pythonnet 调用, 输出深度图(mm)+RGB
sizector:
  enabled: true
  # .NET wrapper 目录 (含 MPSizectorS_DotNet.dll), 按实际 SDK 安装路径修改
  dll_dir: "E:/2_技术产品与项目交付/2_2_SDK与开发环境/1_11AI视觉应用模块与3D视觉算法库开发包/MPSizectorS_SDK_V2_70/02_Binary/03_SizectorS_NET"
  index: 0                   # 多相机时按枚举顺序选择
  serial: ""                 # 可选: 按序列号精确匹配目标相机 (优先于 index)
  working_mode: "precise"    # fastest | fast | standard | precise | super_precise | dynamic
  use_rgb: true              # 采集辅助 RGB (否则仅灰度)
  timeout_ms: 5000
  mock: false                # true 时不连硬件, 输出合成深度帧 (开发/演示/CI)
  mock_width: 640
  mock_height: 480

# 默认激活场景 (UI 启动时优先展示)
default_scenes:
  - "contract"               # 合同自动化 (P0)
  - "qc"                    # 工业质检 (P0)

# 条码识别
barcode:
  engine: "zbar"             # dynamsoft | zbar
  dynamsoft_license: ""

# 质检
qc:
  anomaly_algorithm: "dinomaly"   # dinomaly | patchcore | visualad
  grounding_dino_model: "tiny"    # tiny (快, 1.2GB) | base (精, 2.5GB)
  confidence_threshold: 0.5
  auto_ng_alert: true

# 行为分析 (P2 可选)
behavior:
  enabled: false
  pose_model: "rtmpose-m"
  fatigue_threshold: 0.7
  sop_sequence: []
